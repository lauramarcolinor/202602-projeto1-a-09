<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08068D">
  <title>Bulbe | Confirmação do pagamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/bulbe.css">
  <link rel="stylesheet" href="../assets/css/confirmacao-pagamento.css">
</head>
<body class="bulbe">
  <div class="app">

    <!-- Topo -->
    <header class="app-topo">
      <a class="app-topo__botao" href="../index.html" aria-label="Voltar para minhas faturas">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m14 6-6 6 6 6"/>
        </svg>
      </a>

      <p class="logo">
        bulbe
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3 5h8" stroke="#26D07C" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M5 9h9" stroke="#FF9E1B" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M3 13h8" stroke="#0D99FF" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="visualmente-oculto">Bulbe Energia</span>
      </p>

      <div style="display:flex;align-items:center;gap:10px">
        <button class="app-topo__botao" type="button" aria-label="Notificações">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </button>
        <p class="avatar" id="avatar" aria-hidden="true">JP</p>
      </div>
    </header>

    <!-- Instalação -->
    <p class="instalacao">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
      </svg>
      <strong>Instalação:</strong> <span id="instalacao-numero">3001423519</span>
      <svg class="instalacao__seta" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m8 9 4-4 4 4"/><path d="m16 15-4 4-4-4"/>
      </svg>
    </p>

    <main id="conteudo">
      <p class="estado" id="estado">Carregando a confirmação…</p>
    </main>

    <!-- Navegação -->
    <nav class="app-nav" aria-label="Navegação principal">
      <a href="../index.html" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
        </svg>
        Faturas
      </a>
      <a href="../index.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
        </svg>
        Consumo
      </a>
      <a href="../index.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>
        </svg>
        Indicações
      </a>
    </nav>

  </div>

  <script type="module" src="../assets/js/confirmacao-pagamento.js"></script>

</html>
