<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08068d">
  <title>Bulbe | Resumo da primeira fatura</title>
  <link rel="stylesheet" href="../assets/css/app-shell.css?v=bulbe-poppins-1">
  <link rel="stylesheet" href="../assets/css/hu01.css?v=hu01-figma-alinhamento-2">
  <link rel="stylesheet" href="../assets/css/typography.css?v=laura-1">
</head>
<body class="app-page">
  <div class="app-shell" aria-label="Aplicativo Bulbe">
    <header class="app-header">
      <button class="icon-button menu-button" type="button" data-action="menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20M2 12h20M2 20h20" /></svg>
      </button>

      <a class="brand" href="../index.html" aria-label="Bulbe, página inicial">
        <span class="brand-name">bulbe</span><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      </a>

      <div class="header-actions">
        <button class="icon-button" type="button" data-action="notifications" aria-label="Notificações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
        </button>
        <button class="profile-button" type="button" data-action="profile" aria-label="Perfil de Marina">M</button>
      </div>
    </header>

    <main class="screen-content">
      <section class="screen-heading" aria-labelledby="screen-title">
        <h1 id="screen-title">Resumo da fatura</h1>
        <p data-field="referencia">—</p>
        <span class="status-pill" id="invoice-status" data-field="status">—</span>
      </section>

      <section class="invoice-card" aria-labelledby="invoice-card-title">
        <h2 id="invoice-card-title" class="sr-only">Valor da primeira fatura</h2>

        <div class="label-row">
          <span>Valor da fatura</span>
        </div>
        <p class="original-value" id="original-value" data-field="original">—</p>

        <div class="discount-row">
          <span>Desconto Bulbe:</span>
          <strong id="discount-value" data-field="desconto">—</strong>
        </div>

        <div class="total-block">
          <span class="total-label">Total a pagar</span>
          <strong class="total-value" id="total-value" data-field="total">—</strong>
        </div>

        <div class="due-date">
          <span>Vencimento</span>
          <strong id="due-date" data-field="vencimento">—</strong>
        </div>

        <button class="primary-button" type="button" data-action="payment" data-requires-invoice disabled>Escolher forma de pagamento</button>
      </section>

      <section class="composition-card" aria-labelledby="composition-title">
        <div>
          <h2 id="composition-title">Composição da fatura</h2>
          <p>Entenda como o valor foi calculado.</p>
        </div>
        <button class="secondary-button" type="button" data-action="details">Ver detalhes da fatura</button>
      </section>

    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item is-active" type="button" data-tab="faturas" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6zM15 3v4h4M9 12h6M9 16h6" /></svg>
        <span>Faturas</span>
      </button>
      <button class="nav-item" type="button" data-tab="consumo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-8 12h6l-1 8 8-12h-6z" /></svg>
        <span>Consumo</span>
      </button>
      <button class="nav-item" type="button" data-tab="indicacoes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3" /><path d="M5 21a7 7 0 0 1 14 0M18 8h4M20 6v4" /></svg>
        <span>Indicações</span>
      </button>
    </nav>
    <p class="screen-feedback" id="screen-feedback" role="status" aria-live="polite"></p>
  </div>

  <script type="module" src="../assets/js/hu01.js?v=valor-figma-1"></script>
</body>
</html>
